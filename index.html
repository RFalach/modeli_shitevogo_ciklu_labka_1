<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>лабка 1</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <section class="panel">
	<div class="row">
	  <button id="fill5Btn" class="fill-btn">Заповнити 5 точок</button>
	  <button id="fill10Btn" class="fill-btn">Заповнити 10 точок</button>
	  <button id="fill20Btn" class="fill-btn">Заповнити 20 точок</button>
	</div>
	<label for="pointsInput">Точки:</label>
	<textarea id="pointsInput" rows="10">
0, 1.0
1, 0.8
2, 0.5
3, 0.1
4, -0.2
</textarea>
	<div class="row">
	  <label for="degreeSelect">Ступінь МНК:</label>
	  <select id="degreeSelect">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
	  </select>
	</div>

	<div class="row">
	  <button id="calcBtn">Обчислити</button>
	  <button id="clearBtn">Очистити</button>
	  <button id="animInterpBtn">Анімація інтерполяції</button>
	  <button id="animLsmBtn">Анімація МНК</button>
	</div>
	<div class="row">
	  <label>Показувати:</label>
	  <label><input type="radio" name="mode" value="all" checked> Усі</label>
	  <label><input type="radio" name="mode" value="interp"> Лагранж</label>
	  <label><input type="radio" name="mode" value="lsm"> МНК</label>
	</div>
      </section>

      <section class="chart-wrap">
	<canvas id="chart"></canvas>
      </section>

      <section class="chart-wrap small">
	<canvas id="residChart"></canvas>
      </section>
      
      <section class="legend">
	<span><i class="dot" style="background:#e74c3c"></i> Дані</span>
	<span><i class="line" style="background:#3498db"></i> Лагранж</span>
	<span><i class="line" style="background:#2ecc71"></i> МНК</span>
	<span><i class="line dash" style="background:#9b59b6"></i> Залишки</span>
      </section>
      
    </main>

    <script src="script.js"></script>
  </body>
</html>
