<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>лабка 1</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <section class="panel">
	<label for="pointsInput">Точки:</label>
	<textarea id="pointsInput" rows="10">
0, 1.0
1, 0.8
2, 0.5
3, 0.1
4, -0.2
</textarea>
	<div class="row">
	  <label for="degreeSelect">Ступінь МНК:</label>
	  <select id="degreeSelect">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
	  </select>
	</div>

	<div class="row">
	  <button id="calcBtn">Обчислити</button>
	  <button id="clearBtn">Очистити</button>
	</div>
      </section>

      <section class="chart-wrap">
	<canvas id="chart"></canvas>
      </section>
      
    </main>

    <script src="script.js"></script>
  </body>
</html>
